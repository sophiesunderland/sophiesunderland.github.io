<!-- Topo Lines — paste inside a section with class="relative isolate"
     (isolate keeps the -z-10 layer inside the section so body backgrounds
      can never paint over the effect) -->
<div
  data-aifx="topo-lines"
  data-aifx-colors="#f1e7cf,#e6d2a8,#d4b384,#b98a5e,#ff5c00"
  data-aifx-speed="0.35"
  data-aifx-density="25"
  class="absolute inset-0 -z-10 pointer-events-none"
  aria-hidden="true"
></div>
