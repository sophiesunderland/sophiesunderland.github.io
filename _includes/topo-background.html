<!-- Topo Lines — paste inside a section with class="relative isolate"
     (isolate keeps the -z-10 layer inside the section so body backgrounds
      can never paint over the effect) -->
<div
  data-aifx="topo-lines"
  data-aifx-colors="#f1e7cf,#e6d2a8,#d4b384,#b98a5e,#ff5c00"
  data-aifx-speed="0.35"
  data-aifx-density="25"
  class="absolute inset-0 -z-10 pointer-events-none"
  aria-hidden="true"
></div>

<!-- Effect runtime — include once per page, before </body> -->
<script src="https://cdn.aidesigner.ai/effects/runtime/v1.js" defer></script>



<style>
  /* Top navigation bar */

.masthead {
  background: rgba(247, 240, 225, 0.72) !important;
  border-bottom: 1px solid rgba(120, 95, 65, 0.12) !important;
  box-shadow: none !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.masthead a {
  background: transparent !important;
  transition: color 0.2s ease;
}

.masthead a:hover {
  color: #ff5c00 !important;
}

  /* Footer */
  .page__footer {
    background: transparent !important;
    border-top: 1px solid rgba(120, 95, 65, 0.18) !important;
    box-shadow: none !important;
  }

  .page__footer,
  .page__footer footer,
  .page__footer .wrapper {
    background-color: transparent !important;
  }

  /* Text colors */
  .masthead,
  .masthead a,
  .page__footer,
  .page__footer a {
    color: #5b4633;
  }
</style>
