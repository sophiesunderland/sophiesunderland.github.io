```html
<!-- Vanta animated background -->
<div id="vanta-background" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

<script>
(function () {
  function initVanta() {
    const background = document.getElementById("vanta-background");

    if (!background || background.dataset.initialized) return;
    if (!window.VANTA || !window.THREE) return;

    background.dataset.initialized = "true";

    window.VANTA.TOPOLOGY({
      el: background,
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      scale: 1.0,
      scaleMobile: 1.0,
      color: 0xf79864,
      backgroundColor: 0xf1e7cf
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initVanta);
  } else {
    initVanta();
  }
})();
</script>
```
